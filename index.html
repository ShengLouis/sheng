<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f8">
  <title>我的待辦清單</title>
  <style>
    :root {
      color-scheme: light;
      --color-page: #f3f5f8;
      --color-page-glow: rgba(91, 112, 214, 0.09);
      --color-card: #ffffff;
      --color-card-border: rgba(231, 234, 240, 0.9);
      --color-text: #253047;
      --color-muted: #8992a3;
      --color-border: #e7eaf0;
      --color-surface-soft: #fbfcfe;
      --color-placeholder: #a7afbd;
      --color-accent: #5b70d6;
      --color-accent-hover: #485fc8;
      --color-on-accent: #ffffff;
      --color-focus-ring: rgba(91, 112, 214, 0.14);
      --color-outline: rgba(91, 112, 214, 0.32);
      --color-danger: #d76570;
      --color-danger-hover: #fff0f1;
      --shadow-card: 0 18px 48px rgba(37, 48, 71, 0.09);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --color-page: #151923;
      --color-page-glow: rgba(115, 132, 235, 0.12);
      --color-card: #202634;
      --color-card-border: #30394a;
      --color-text: #edf0f7;
      --color-muted: #a3adbf;
      --color-border: #394354;
      --color-surface-soft: #272f3e;
      --color-placeholder: #8994a8;
      --color-accent: #8293f0;
      --color-accent-hover: #96a4f5;
      --color-on-accent: #171b27;
      --color-focus-ring: rgba(130, 147, 240, 0.2);
      --color-outline: rgba(130, 147, 240, 0.42);
      --color-danger: #f08a94;
      --color-danger-hover: #482d37;
      --shadow-card: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 72px 20px 40px;
      background:
        radial-gradient(ellipse at 50% 0, var(--color-page-glow), transparent 55%),
        var(--color-page);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 36px;
      border: 1px solid var(--color-card-border);
      border-radius: 20px;
      background: var(--color-card);
      box-shadow: var(--shadow-card);
    }

    .app-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--color-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    h1 {
      grid-column: 2;
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2rem);
      letter-spacing: 0.03em;
    }

    .btn-theme {
      display: inline-flex;
      grid-column: 3;
      align-items: center;
      justify-self: end;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      background: var(--color-surface-soft);
      color: var(--color-text);
      font: inherit;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    .btn-theme:hover {
      border-color: var(--color-accent);
    }

    .btn-theme:focus-visible,
    .btn-filter:focus-visible,
    .btn-add:focus-visible,
    .btn-delete:focus-visible,
    .todo-item input:focus-visible {
      outline: 3px solid var(--color-outline);
      outline-offset: 2px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--color-muted);
      font-size: 0.94rem;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .todo-input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-surface-soft);
      color: var(--color-text);
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .todo-input::placeholder {
      color: var(--color-placeholder);
    }

    .todo-input:focus-visible {
      border-color: var(--color-accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--color-focus-ring);
    }

    .btn-add {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: var(--color-accent);
      color: var(--color-on-accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .btn-add:hover {
      background: var(--color-accent-hover);
    }

    .btn-add:active {
      transform: translateY(1px);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: -6px 0 16px;
    }

    .btn-filter {
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--color-surface-soft);
      color: var(--color-muted);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .btn-filter:hover {
      border-color: var(--color-border);
      color: var(--color-text);
    }

    .btn-filter.is-active {
      border-color: var(--color-accent);
      background: var(--color-accent);
      color: var(--color-on-accent);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-card);
      animation: appear 180ms ease-out;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--color-accent);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .todo-item.completed .todo-text {
      color: var(--color-muted);
      text-decoration: line-through;
    }

    .btn-delete {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--color-danger);
      font: inherit;
      font-size: 0.84rem;
      cursor: pointer;
      transition: background-color 160ms ease;
    }

    .btn-delete:hover {
      background: var(--color-danger-hover);
    }

    .empty-state {
      margin: 0;
      padding: 24px 12px;
      color: var(--color-muted);
      text-align: center;
      line-height: 1.6;
    }

    .app-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      color: var(--color-muted);
      font-size: 0.84rem;
    }

    .footer-note {
      text-align: right;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 540px) {
      body {
        padding: 28px 14px;
      }

      .title-row {
        grid-template-columns: 1fr;
      }

      h1 {
        grid-column: 1;
      }

      .btn-theme {
        grid-column: 1;
        justify-self: center;
        margin-top: 8px;
      }

      .app {
        padding: 26px 20px;
        border-radius: 16px;
      }
    }

    @media (max-width: 360px) {
      .todo-form {
        flex-direction: column;
      }

      .btn-add {
        min-height: 46px;
      }

      .app-footer {
        flex-direction: column;
      }

      .footer-note {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">一天一點點，也能完成很多事</p>
      <div class="title-row">
        <h1>我的待辦清單</h1>
        <button id="theme-toggle" class="btn-theme" type="button" aria-pressed="false">
          <span id="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
      <p class="subtitle">把想做的事記下來，逐項完成吧。</p>
    </header>

    <!-- 新增待辦事項的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼？"
        maxlength="200"
        required
      >
      <button class="btn-add" type="submit">新增</button>
    </form>

    <!-- 篩選待辦事項 -->
    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button class="btn-filter is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="btn-filter" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="btn-filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦清單由內嵌 JavaScript 動態產生 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <!-- 清單為空時顯示的提示 -->
    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count" aria-live="polite">未完成:0 項</span>
      <span class="footer-note">每完成一項，都是一小步。</span>
    </footer>
  </main>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const remainingCount = document.getElementById('remaining-count');
    const filterButtons = document.querySelectorAll('.btn-filter');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    let todos = [];
    let currentFilter = 'all';

    // 套用主題並更新切換按鈕的圖示、文字與狀態。
    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.dataset.theme = theme;
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeLabel.textContent = isDark ? '淺色模式' : '深色模式';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    // 依照作業系統目前使用的深淺色設定套用主題。
    function initTheme() {
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(systemPrefersDark ? 'dark' : 'light');
    }

    // 依照目前篩選條件取得要顯示的待辦項目。
    function getVisibleTodos() {
      if (currentFilter === 'active') {
        return todos.filter((todo) => !todo.completed);
      }
      if (currentFilter === 'completed') {
        return todos.filter((todo) => todo.completed);
      }
      return todos;
    }

    // 根據整體清單狀態與篩選條件選擇空清單提示。
    function getEmptyMessage() {
      if (todos.length === 0) {
        return '還沒有任何待辦事項,新增一個吧!';
      }
      if (currentFilter === 'active') {
        return '太棒了，沒有未完成的事項！';
      }
      if (currentFilter === 'completed') {
        return '還沒有已完成的事項。';
      }
      return '還沒有任何待辦事項,新增一個吧!';
    }

    // 依照目前資料更新待辦項目、空清單提示與未完成數量。
    function render() {
      list.replaceChildren();

      const visibleTodos = getVisibleTodos();
      visibleTodos.forEach((todo) => {
        const item = document.createElement('li');
        item.className = todo.completed ? 'todo-item completed' : 'todo-item';
        item.dataset.id = todo.id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `標記「${todo.text}」為完成`);

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn-delete';
        deleteButton.textContent = '刪除';
        deleteButton.setAttribute('aria-label', `刪除「${todo.text}」`);

        item.append(checkbox, text, deleteButton);
        list.append(item);
      });

      emptyState.textContent = getEmptyMessage();
      emptyState.hidden = visibleTodos.length > 0;
      remainingCount.textContent = `未完成:${todos.filter((todo) => !todo.completed).length} 項`;
    }

    // 切換目前的篩選條件並更新按鈕狀態。
    function setFilter(filter) {
      currentFilter = filter;

      filterButtons.forEach((button) => {
        const isActive = button.dataset.filter === filter;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });

      render();
    }

    // 產生待辦事項識別碼。
    function createId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      todos.push({
        id: createId(),
        text,
        completed: false,
      });

      render();
      input.value = '';
      input.focus();
    });

    list.addEventListener('change', (event) => {
      if (!event.target.matches('input[type="checkbox"]')) {
        return;
      }

      const item = event.target.closest('.todo-item');
      if (!item) {
        return;
      }

      const todo = todos.find((entry) => entry.id === item.dataset.id);
      if (!todo) {
        return;
      }

      todo.completed = event.target.checked;
      render();
    });

    list.addEventListener('click', (event) => {
      if (!event.target.matches('.btn-delete')) {
        return;
      }

      const item = event.target.closest('.todo-item');
      if (!item) {
        return;
      }

      todos = todos.filter((todo) => todo.id !== item.dataset.id);
      render();
    });

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => setFilter(button.dataset.filter));
    });

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.dataset.theme;
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    initTheme();
    render();
  </script>
</body>
</html>
